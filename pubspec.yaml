name: keyrnunnlock
description: "Coffre-fort local de mots de passe"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.5
  local_auth: ^2.3.0
  flutter_secure_storage: ^9.2.4
  cryptography: ^2.7.0
  path_provider: ^2.1.5
  share_plus: ^10.0.3
  file_picker: ^8.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/keyrnunnlock-logo.jpeg
  min_sdk_android: 21
